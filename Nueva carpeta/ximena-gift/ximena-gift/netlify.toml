[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback: los archivos reales (fotos, funciones, etc.) siempre tienen
# prioridad sobre este redirect, así que es seguro dejarlo así de simple.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
