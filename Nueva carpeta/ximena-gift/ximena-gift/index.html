<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A63446" />
    <meta name="description" content="Un rincón solo para nosotros." />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Valentina & Mateo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Formulario estático oculto: le sirve a Netlify para DETECTAR el
      formulario al momento del build (Netlify Forms sólo detecta HTML
      plano, no formularios generados por React). El formulario real que
      ve Ximena vive en NotesWall.jsx y envía los datos por fetch a esta
      misma definición ("form-name=notas").
    -->
    <form name="notas" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <textarea name="mensaje"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
